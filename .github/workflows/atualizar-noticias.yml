name: Atualizar notícias da Central de Notícias
on:
  push:
    paths:
      - 'scripts/atualizar_noticias.py'
      - '.github/workflows/atualizar-noticias.yml'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: noticias-cria-rj
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Buscar manchetes autorizadas
        run: python scripts/atualizar_noticias.py
      - name: Registrar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar manchetes verificadas"
            git push
          fi
